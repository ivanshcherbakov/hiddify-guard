name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore src/HiddifyGuard.sln
      - run: dotnet build src/HiddifyGuard.sln -c Release --no-restore
      - run: dotnet test src/HiddifyGuard.sln -c Release --no-build --logger trx
      - name: Read-only smoke test
        run: dotnet src/HiddifyGuard.App/bin/Release/net8.0-windows/HiddifyGuard.dll --self-test
      - name: Temporary rule plan and failure injection (no policy changes)
        shell: pwsh
        run: ./scripts/temporary/Test-Plan.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
