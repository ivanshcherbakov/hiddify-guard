name: Build release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version (manual runs upload artifacts without publishing a release)'
        required: true
        default: '0.1.0'
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate version
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { $env:DISPATCH_VERSION }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw 'Invalid version' }
          "BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            winget install --id JRSoftware.InnoSetup --exact --source winget --silent --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Test, publish, compile installer and hash artifacts
        shell: pwsh
        run: ./scripts/build.ps1 -Version $env:BUILD_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: HiddifyGuard-${{ env.BUILD_VERSION }}-x64
          path: |
            dist/HiddifyGuard-Portable-*-x64.zip
            dist/HiddifyGuard-Setup-*-x64.exe
            dist/SHA256SUMS.txt
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @("dist/HiddifyGuard-Setup-$env:BUILD_VERSION-x64.exe", "dist/HiddifyGuard-Portable-$env:BUILD_VERSION-x64.zip", "dist/SHA256SUMS.txt")
          $options = @('release', 'create', $env:GITHUB_REF_NAME, '--generate-notes', '--verify-tag', '--title', "Hiddify Guard $env:BUILD_VERSION")
          if ($env:BUILD_VERSION.StartsWith('0.') -or $env:BUILD_VERSION.Contains('-')) { $options += '--prerelease' }
          gh @options @files
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
